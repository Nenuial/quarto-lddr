title: "LDDR book"
author: "Pascal Burkhard"
version: 1.5.1
contributes:
  format:
    html:
      # both themes, light first: with only "dark", Quarto >= 1.9 starts in dark mode
      # but loads the light stylesheet last, so the dark theme never shows
      theme:
        light: default
        dark: darkly
      css: style.css
      mainfont: "Fira Sans"
      toc: true
      # licence and AI label of each chapter (metadata cc, ai; see lddr-badges/badges-book.lua)
      filters:
        - path: badges-html.lua
          at: pre-quarto
    pdf:
      documentclass: book
      template-partials:
        - title.tex
        - pandoc.tex
        - before-body.tex
      include-in-header:
        - structure.tex
      colorlinks: false
      callout-icon: false
      variables:
        logo: "../lddr-resources/images/logo_LDDR_couleur.pdf"
        font-path: "../lddr-resources/fonts/"
    # Typst book, built on orange-book (the Typst port of the Legrand Orange Book,
    # like the LaTeX version): vendored in orange-book/, LDDR additions in lddr-book.typ.
    # typst-show.typ imports lddr-book.typ from _extensions/nenuial/lddr-book/ directly.
    typst:
      papersize: a4
      toc: true
      callout-icon: false
      font-paths: "../lddr-resources/fonts/"
      template-partials:
        - typst-show.typ
        - page.typ
        - numbering.typ
      filters:
        - path: lddr-book.lua
          at: post-quarto
        - path: badges-typst.lua
          at: post-quarto
      variables:
        logo: "_extensions/nenuial/lddr-resources/images/logo_LDDR_couleur.pdf"
source: nenuial/quarto-lddr
