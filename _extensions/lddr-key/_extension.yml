# Shared theme files in keynote/ are copied from nenuial/quarto-keynote (sync-shared.sh).
title: LDDR theme
author: Pascal Burkhard
version: 3.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      theme: ["keynote/global.scss", "keynote/letterbox.scss", "keynote/custom-callouts.scss", "lddr.scss"]
      include-after-body: "keynote/theme.html"
      logo: "images/lddr.svg"
      filters:
        - keynote/custom-callouts.lua
      revealjs-plugins:
        - keynote/codewindow
      width: 1280
      height: 720
source: nenuial/quarto-lddr
